<!DOCTYPE html>
<html>
<head>
    <title>Meu Bolso - Cadastro</title>
</head>
<body>
    <h1>Crie sua conta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem uma conta? <a href="{% url 'login' %}">Faça login aqui</a>.</p>
</body>
</html>
